name: check

on: [push]

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Installer l'API depuis son verrou et les outils de test
        run: |
          pip install -r requirements.lock
          pip install -e ".[dev]"
      - name: Verifier
        run: make check

  # Environnement distinct : mcp exige pydantic>=2.12, browser-use pydantic<2.11
  # (C81). Le serveur MCP n'importe rien de app/ : il se teste seul.
  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Installer le serveur MCP depuis son verrou
        run: make install-mcp
      - name: Verifier
        run: make check-mcp
