# Configuration SearXNG de webtools : source unique, versionnee.
#
# Image visee : voir docker-compose.yml (epinglee par condensat). Les noms de
# moteurs ci-dessous sont ceux de cette version ; ils sont verifies par
# tests/unit/config/test_searxng_settings.py contre les moteurs que le code
# attend (AXIS_PREFERENCE, ENGINE_INTERVALS dans app/).
#
# Le format JSON est INDISPENSABLE : le service interroge /search?format=json
# et /config. Par defaut seul "html" est actif, et toutes les recherches
# echouent sans que la cause soit evidente.
#
# Secret : jamais ici. SearXNG remplace secret_key par la variable
# d'environnement SEARXNG_SECRET (obligatoire, voir docker-compose.yml et
# start_all.sh).
use_default_settings: true

server:
  secret_key: "ultrasecretkey"  # remplace par SEARXNG_SECRET
  limiter: false
  image_proxy: false

search:
  formats:
    - html
    - json
  safe_search: 0
  autocomplete: ""

# Chaque moteur attendu par le code est liste ici, actif ("disabled: false"
# et "inactive: false" : plusieurs sont inactifs ou desactives par defaut en
# amont). Les categories sont celles qui placent le moteur sur le bon axe
# de app/services/engine_catalog.py (CATEGORY_TO_AXIS) :
#   generaliste -> general/web ; academique -> science ;
#   actualite -> news ; technique -> it ; encyclopedique -> wikimedia.
# "wikipedia search" n'existe pas en amont : c'est le moteur mediawiki sur
# l'API de recherche de Wikipedia (le moteur amont "wikipedia" ne fait
# qu'un acces par titre exact).
engines:
  - name: wikipedia search
    engine: mediawiki
    shortcut: wps
    base_url: "https://{language}.wikipedia.org/"
    search_type: "text"
    categories: [general, web]
    disabled: false
    inactive: false

