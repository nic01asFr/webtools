# Trois services, les memes que start_all.sh :
#   searxng       moteur de recherche (conteneur a part, jamais expose)
#   webtools      API FastAPI (environnement Python /opt/venv-api)
#   webtools-mcp  serveur MCP, client HTTP de l'API (environnement /opt/venv-mcp)
# Les deux services Python utilisent la meme image (docker/Dockerfile) ; seul
# l'interpreteur differe, car leurs dependances sont incompatibles (C81).
#
# Variables obligatoires : WEBTOOLS_API_KEY, DEFAULT_LLM_API_KEY, SEARXNG_SECRET,
# SEARXNG_CONTACT_URL, MCP_ACCESS_TOKEN. Les defauts LLM sont ceux de
# app/core/config.py et .env.example.

services:
  webtools:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        # Identite du code pour /health.commit (l'image n'a pas de git) :
        #   WEBTOOLS_COMMIT=$(git rev-parse HEAD) docker compose build
        WEBTOOLS_COMMIT: ${WEBTOOLS_COMMIT:-unknown}
    image: webtools:local
    container_name: webtools-service
    # Profil de drapeaux du pipeline (docker/profils/). Aucun par defaut ;
    # WEBTOOLS_PROFIL_ENV=docker/profils/sspcloud-modele-lent.env pour le
    # proxy SSPCloud lent.
    env_file:
      - path: ${WEBTOOLS_PROFIL_ENV:-docker/profils/aucun.env}
        required: false
    depends_on:
      - searxng
    networks:
      - proxy
      - webtools-internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.webtools.rule=Host(`webtools.colaig.fr`)"
      - "traefik.http.routers.webtools.entrypoints=websecure"
      - "traefik.http.routers.webtools.tls=true"
      - "traefik.http.routers.webtools.tls.certresolver=letsencrypt"
      - "traefik.http.services.webtools.loadbalancer.server.port=8000"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000

      # Cle protegeant l'API REST publique (en-tete X-API-Key). Sans elle,
      # l'API est ouverte a quiconque connait l'URL.
      - WEBTOOLS_API_KEY=${WEBTOOLS_API_KEY:?WEBTOOLS_API_KEY doit etre defini}

      # LLM : les defauts sont ceux de app/core/config.py
      - DEFAULT_LLM_PROVIDER=${DEFAULT_LLM_PROVIDER:-openai}
      - DEFAULT_LLM_MODEL=${DEFAULT_LLM_MODEL:-qwen3-6-35b-moe}
      - DEFAULT_LLM_BASE_URL=${DEFAULT_LLM_BASE_URL:-https://llm.lab.sspcloud.fr/api}
      - DEFAULT_LLM_API_KEY=${DEFAULT_LLM_API_KEY:?DEFAULT_LLM_API_KEY doit etre defini}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-${DEFAULT_LLM_API_KEY}}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-${DEFAULT_LLM_BASE_URL:-https://llm.lab.sspcloud.fr/api}}

      # SearXNG : dependance reelle du pipeline de recherche (reseau interne).
      - SEARXNG_BASE_URL=http://searxng:8080

      # Playwright : chemin explicite, coherent avec le Dockerfile
      - PLAYWRIGHT_HEADLESS=true
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
      - PLAYWRIGHT_TIMEOUT=45000

      - DEFAULT_EXTRACTION_TIMEOUT=45
      - LOG_LEVEL=${LOG_LEVEL:-INFO}

    restart: unless-stopped

    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  webtools-mcp:
    image: webtools:local
    container_name: webtools-mcp
    # Meme image que l'API, interpreteur du serveur MCP.
    command: ["/opt/venv-mcp/bin/python", "mcp_server.py"]
    depends_on:
      - webtools
    networks:
      - proxy
      - webtools-internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.webtools-mcp.rule=Host(`${MCP_PUBLIC_HOST:-localhost}`)"
      - "traefik.http.routers.webtools-mcp.entrypoints=websecure"
      - "traefik.http.routers.webtools-mcp.tls=true"
      - "traefik.http.routers.webtools-mcp.tls.certresolver=letsencrypt"
      - "traefik.http.services.webtools-mcp.loadbalancer.server.port=8090"
    environment:
      # Le serveur MCP joint l'API par le reseau interne, avec la meme cle.
      - WEBTOOLS_API=http://webtools:8000
      - WEBTOOLS_API_KEY=${WEBTOOLS_API_KEY:?WEBTOOLS_API_KEY doit etre defini}
      - WEBTOOLS_STATE_DIR=/state
      - MCP_ACCESS_TOKEN=${MCP_ACCESS_TOKEN:?MCP_ACCESS_TOKEN doit etre defini}
      - MCP_PUBLIC_URL=${MCP_PUBLIC_URL:-http://localhost:8090}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - webtools-mcp-state:/state
    restart: unless-stopped
    # Le HEALTHCHECK de l'image cible l'API (8000) : ce service n'ecoute que
    # sur 8090. Le serveur MCP n'a pas de route /health ; la route de
    # decouverte OAuth repond 200 sans authentification (/mcp repond 401).
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/.well-known/oauth-authorization-server"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  searxng:
    # Image epinglee par condensat (le tag seul est indicatif). Pour la mettre
    # a jour : docker buildx imagetools inspect searxng/searxng:latest, puis
    # relire docker/searxng/settings.yml (noms de moteurs) et lancer
    # tests/unit/config.
    image: searxng/searxng:2026.11.12-de722ab1b@sha256:0b104e2e1117b0ca83a36f3ac6ecda7d9ee948ccea6ead74750a03e1b856229a
    container_name: webtools-searxng
    networks:
      - webtools-internal
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
      - SEARXNG_SETTINGS_PATH=/etc/searxng/settings.yml
      # Clef de session : a definir, sinon SearXNG refuse de demarrer
      - SEARXNG_SECRET=${SEARXNG_SECRET:?SEARXNG_SECRET doit etre defini}
      # Exigee par les moteurs wikipedia et wikidata (politique d'usage de
      # Wikimedia) : une URL ou un mailto: de contact de l'exploitant.
      - SEARXNG_CONTACT_URL=${SEARXNG_CONTACT_URL:?SEARXNG_CONTACT_URL doit etre defini}
    volumes:
      - ./docker/searxng:/etc/searxng:rw
    restart: unless-stopped
    # Pas de port publie : accessible uniquement depuis le reseau interne,
    # jamais expose a l'exterieur.

volumes:
  webtools-mcp-state:

networks:
  proxy:
    external: true
  webtools-internal:
    driver: bridge
