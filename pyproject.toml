[project]
name = "webtools-service"
version = "3.0.0"
description = "Service autonome d'extraction de contenu web avec support multi-LLM"
authors = [
    { name = "Webtools" }
]
requires-python = ">= 3.11"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    # Web Framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",

    # Browser Automation
    "browser-use==0.1.41",
    "playwright>=1.40.0",

    # LLM Support. Les pins langchain-* et la borne pydantic<2.11 sont ceux
    # que browser-use==0.1.41 impose (verifie par ses metadonnees) : ils ne
    # sont pas un choix, et les relever casse la resolution.
    "langchain-openai==0.3.11",
    "langchain-anthropic==0.3.3",
    "langchain-core==0.3.49",
    "openai>=1.68.2",
    "anthropic>=0.19.0",

    # Extraction de contenu (import direct dans direct_extractor.py, sans
    # try/except : sans cette declaration, un build propre produit une image
    # ou l'extraction directe plante sur le chemin nominal)
    "trafilatura>=2.0.0",

    # Extraction PDF (pdf_extractor.py) : sans eux tout PDF est rendu comme
    # "probablement scanne" (C58)
    "pdfplumber>=0.11.0",
    "pypdf>=4.0.0",

    # HTTP Clients (aiohttp et requests retires : jamais importes dans le
    # code actif, le service utilise exclusivement httpx - dependances
    # mortes qui n'ajoutaient qu'une surface d'attaque theorique inutile)
    "httpx[http2]>=0.27.2",  # http2=True dans le client Albert (h2)

    # Data Validation
    "pydantic>=2.10.4,<2.11",  # borne imposee par browser-use==0.1.41
    "pydantic-settings==2.3.4",

    # Utilities
    "tenacity==8.2.3",
    "filelock==3.12.2",
    "python-multipart>=0.0.6",
    "beautifulsoup4>=4.12.0",

    # Chargement de .env dans os.environ au demarrage (app/main.py) ; deja
    # tire par browser-use, declare ici parce que le code l'importe.
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# Serveur MCP (mcp_server.py). Environnement distinct de l'API : les mcp
# recents (via fastmcp>=3) exigent pydantic>=2.12, incompatible avec
# browser-use==0.1.41. Un extra s'ajoute aux dependances principales, donc
# ".[mcp]" reintroduit browser-use et ne se resout pas : installer la liste
# ci-dessous seule (make check-mcp la verifie), dans son propre venv.
mcp = [
    "fastmcp>=3.0.0",
    "mcp>=1.0.0",
    "starlette>=0.37.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.2",
    "ruff>=0.1.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
package-dir = {""="."}

[tool.ruff]
line-length = 100
src = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: test exigeant le reseau ou un LLM reel, exclu par defaut de make check",
]
